<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ignition</title>
    <style>
      :root{
        --bg:#f5f8fb; --card:#ffffff; --muted:#6b7280; --primary:#2b6cf6; --input:#f1f5f9;
      }
      html,body{height:100%;}
      body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial; margin:0; background:var(--bg); color:#0f172a; }
      .wrap{max-width:1100px;margin:28px auto;padding:20px;}
      .header{display:flex;align-items:center;gap:16px;margin-bottom:18px}
      .logo{width:56px;height:56px;background:linear-gradient(135deg,#2b6cf6,#7c3aed);border-radius:12px;display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:20px}
      .title{display:flex;flex-direction:column}
      .title h1{margin:0;font-size:20px}
      .brand{background:linear-gradient(90deg,#2b6cf6,#7c3aed,#ff7a18);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
      .title p{margin:0;color:var(--muted);font-size:13px}

      .card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 6px 18px rgba(15,23,42,0.06);margin-bottom:18px}
      .row{display:flex;gap:16px;align-items:center}
      .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
      label{font-size:13px;color:#111827}
      .field{display:flex;flex-direction:column;gap:6px}
      input[type=text], input[type=password], input[type=url], input[type=number], select{background:var(--input);border:1px solid rgba(15,23,42,0.06);padding:10px 12px;border-radius:8px;font-size:14px;color:#0f172a}

      .muted{color:var(--muted);font-size:13px}
      .actions{margin-top:12px}
      button{background:var(--primary);color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer}
      button.secondary{background:transparent;border:1px solid rgba(15,23,42,0.06);color:#111827;padding:10px 14px}
      .hint{font-size:13px;color:var(--muted);margin-top:8px}

      @media (max-width:900px){ .grid{grid-template-columns:repeat(2,1fr)} .header{flex-direction:row} }
      @media (max-width:520px){ .grid{grid-template-columns:1fr} .header{gap:10px} }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <div class="logo">⚡</div>
        <div class="title">
          <h1><span class="brand">Ignition</span></h1>
          <p class="muted">Data Seeder Interface</p>
        </div>
        <div style="margin-left:auto">
          <label class="field">Mode
            <select id="mode">
              <option value="manual">Manual</option>
            </select>
          </label>
        </div>
      </div>

      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap">
          <div style="flex:1;min-width:280px">
            <div class="grid">
              <div class="field">
                <label>Facility Id</label>
                <input id="facilityId" type="number" placeholder="e.g. 2030" value="40"/>
              </div>
              <div class="field" style="grid-column: span 3">
                <label>Target API URL</label>
                <input id="apiUrl" type="url" value="https://sisenterprise-api-329114e1-centralindia.siscompletedev.cloud/329114e1t1" placeholder="https://sisenterprise-api-329114e1-centralindia.siscompletedev.cloud/329114e1t1" />
              </div>
              <div class="field">
                <label>Username</label>
                <input id="username" type="text" placeholder="username" value="sisadmin"/>
              </div>
              <div class="field" style="position:relative">
                <label>Password</label>
                <div style="position:relative;display:flex;align-items:center">
                  <input id="password" type="password" placeholder="password" style="flex:1" value="Test#123"/>
                  <button id="pwdToggle" title="Show password" aria-pressed="false" style="margin-left:8px;border-radius:8px;padding:8px;border:none;background:transparent;cursor:pointer">Show</button>
                </div>
              </div>
            </div>
            <div class="actions">
              <button id="loginBtn">Login</button>
            </div>
            <div class="hint">Click Login to authenticate against the server and obtain a token for seeding.</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap">
          <div style="flex:1;min-width:320px">
            <div class="field">
              <label>Suffix</label>
              <input id="suffix" type="text" placeholder="e.g. 336152" />
              <div class="muted">Include the test case id in the suffix so generated records are easy to trace.</div>
            </div>
          </div>
          <div style="width:120px">
            <div class="field">
              <label>Count</label>
              <input id="count" type="number" min="1" value="1" />
            </div>
          </div>
          <div style="width:150px">
            <div class="field">
              <label>Concurrency</label>
              <input id="concurrency" type="number" min="1" value="4" />
              <div class="muted">Parallel API calls.</div>
            </div>
          </div>
        </div>
        <div class="actions" style="margin-top:16px">
          <button id="runBtn">Run</button>
        </div>
      </div>

      <!-- Rooms removed (disabled while not used) -->

    </div>

    <div style="max-width:1100px;margin:0 auto 36px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div style="color:#94a3b8;font-size:13px;font-weight:600">Output Log</div>
        <div id="elapsedDisplay" style="color:#94a3b8;font-size:13px;font-weight:600">Total: 0.00s</div>
      </div>
      <div class="card" id="logCard" style="height:220px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,monospace;background:#0f172a;color:#e6eef8;padding:12px;">
        <!-- logs will appear here -->
      </div>
    </div>
    <script src="./ui.js"></script>
  </body>
</html>
